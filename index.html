<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Welcome</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #172033; background: #f4f6fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(680px, 100%); background: #fff; border: 1px solid #e3e7ef; border-radius: 18px; padding: clamp(24px, 5vw, 44px); box-shadow: 0 12px 40px #17203312; }
    h1 { margin: 0 0 12px; font-size: clamp(1.5rem, 4vw, 2rem); }
    p { line-height: 1.65; color: #465166; }
    .notice { display: inline-block; padding: 5px 10px; border-radius: 999px; background: #f1f3f7; color: #465166; font-size: .85rem; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <span class="notice">Not open yet</span>
    <h1>Welcome</h1>
    <p>This study page is being prepared and is not currently accepting participants.</p>
    <p>Please return only when you have received an invitation and access instructions from the researcher.</p>
  </main>
</body>
</html>
